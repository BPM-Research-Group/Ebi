name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:

    build_release:
        runs-on: ubuntu-latest
        permissions: write-all
        steps:

            - name: Checkout
              uses: actions/checkout@v4

            - name: Update version number
              id: version
              run: |
                cargo install cargo-edit
                VERS=${{ github.ref_name }}
                VERS="${VERS:1}"
                cargo set-version "$VERS"
                echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT

            - name: Generate manual parts 
              run: |
                cargo run itself manual -o manual/functions.tex
                cargo run itself graph -o manual/graph.pdf

            - name: setup build environment
              run: |
                rustup target add x86_64-unknown-linux-gnu
                sudo apt-get install mingw-w64
                rustup target add x86_64-pc-windows-gnu

            - name: Build manual
              uses: xu-cheng/texlive-action@v3
              with:
                run: |
                    cd manual
                    lualatex -shell-escape manual.tex
                    bibtex manual
                    lualatex -shell-escape manual.tex
                    lualatex -shell-escape manual.tex
                    cd ..

            - parallel:

              - name: Build CLI for Linux 64 bit
                run: |
                  cargo build --release --target x86_64-unknown-linux-gnu
                  mv target/x86_64-unknown-linux-gnu/release/ebi Ebi-x86_64-linux

              - name: Build CLI for Windows 64 bit
                run: |
                  cargo build --release --target x86_64-pc-windows-gnu
                  mv target/x86_64-pc-windows-gnu/release/ebi.exe Ebi-x86_64-windows.exe

            - parallel:

              - name: Build Java library for Linux
                run: |
                  cargo build --target x86_64-unknown-linux-gnu --release --features java
                  mv target/x86_64-unknown-linux-gnu/release/ebi java-library-x86_64-linux_libebi.so

              - name: Build Java for Windows
                run: |
                  cargo build --target x86_64-pc-windows-gnu --release --features java
                  mv target/x86_64-pc-windows-gnu/release/ebi.dll java-library-x86_64-windows_ebi.dll

              - name: Test-build crates.io publishing
                run: cargo publish --allow-dirty --dry-run
                env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

            - name: Create CLI release
              uses: actions/create-release@v1
              id: create_release
              if: github.ref_type == 'tag'
              env: 
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with: 
                tag_name: ${{ github.ref_name }}
                release_name: Release ${{ steps.version.outputs.version }}

            - name: Add manual to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: manual/manual.pdf
                asset_name: manual.pdf
                asset_content_type: application/pdf

            - name: Add Linux to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: Ebi-x86_64-linux
                asset_name: Ebi-x86_64-linux
                asset_content_type: application/x-executable

            - name: Add Windows to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: Ebi-x86_64-windows.exe
                asset_name: Ebi-x86_64-windows.exe
                asset_content_type: application/vnd.microsoft.portable-executable

            - name: Add Java-Linux to release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: java-library-x86_64-linux_libebi.so
                asset_name: libebi.so
                asset_content_type: application/x-sharedlib

            - name: Add Java-Windows to release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: java-library-x86_64-windows_ebi.dll
                asset_name: ebi.dll
                asset_content_type: application/vnd.microsoft.portable-executable     

            - name: Publish on crates.io
              run: cargo publish --allow-dirty
              env:
                CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

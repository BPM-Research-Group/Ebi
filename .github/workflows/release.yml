name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions: write-all
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate manual parts
              run: |
                cargo run itself manual -o manual/functions.tex
                cargo run itself graph -o manual/graph.pdf

            - name: Compile manual
              uses: xu-cheng/texlive-action@v3
              with:
                run: |
                    cd manual
                    lualatex -shell-escape manual.tex
                    bibtex manual
                    lualatex -shell-escape manual.tex
                    lualatex -shell-escape manual.tex
                    cd ..

            - name: Create release
              uses: actions/create-release@v1
              id: create_release
              if: github.ref_type == 'tag'
              env: 
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with: 
                tag_name: ${{ github.ref_name }}
                release_name: Release ${{ github.ref_name }}
                
            - name: Add manual to release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: manual/manual.pdf
                asset_name: manual ${{ github.ref_name }}.pdf
                asset_content_type: application/pdf

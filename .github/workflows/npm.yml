name: Build javascript

on:
  push:
    tags:
      - 'n*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build NPM package
        run: |
          > src/javascript/javascript_autogen.rs
          cargo run --features "javascript test_generation" -- itself javascript -o src/javascript/javascript_autogen.rs
          wasm-pack build -- --features javascript
          sed -i 's/"name": "ebi"/"name": "ebi_pm"/' pkg/package.json
          wasm-pack pack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registery-url: https://registry.npmjs.org
      
      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

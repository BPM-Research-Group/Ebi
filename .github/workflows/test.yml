name: Test Ebi

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    uses: $/.github/workflows/generate.yml

  test_mixed_mode_1:
    runs-on: ubuntu-latest
    needs: generate
    steps:
    - name: Run tests mixed mode 1
      run: cargo test --verbose

  test_mixed_mode_2:
    runs-on: ubuntu-latest
    needs: generate
    steps:
    - name: Run tests mixed mode 2
      run: cargo test --verbose --features exactarithmetic,approximatearithmetic

  test_exact_mode:
    runs-on: ubuntu-latest
    needs: generate
    steps:  
    - name: Run tests exact mode
      run: cargo test --verbose --features exactarithmetic

  test_approximate_mode:
    runs-on: ubuntu-latest
    needs: generate
    steps:
    - name: Run tests approximate mode
      run: cargo test --verbose --features approximatearithmetic

  test_java:
    runs-on: ubuntu-latest
    needs: generate
    steps:
    - name: Run tests java
      run: cargo test --verbose --features java

  test_javascript:
    runs-on: ubuntu-latest
    needs: generate
    steps:
    - name: Run tests javascript
      run: cargo test --verbose --features javascript
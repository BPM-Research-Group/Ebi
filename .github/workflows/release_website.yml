name: Release website

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build_website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wasm
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Github pages
        uses: actions/configure-pages@v4
        
      - name: Build website
        run: |
          > src/javascript/javascript_autogen.rs
          cargo run --features "javascript test_generation" -- itself javascript -o src/javascript/javascript_autogen.rs
          wasm-pack build -d ./website/javascript --target web -- --features javascript
          cargo run itself website home -o website/index.html
          cargo run itself website commands -o website/commands.html
          cargo run itself website file-handlers -o website/file_handlers.html
      
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/'
          
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
          

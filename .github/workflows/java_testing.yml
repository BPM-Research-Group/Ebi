name: Release CLI, Java and manual

on:
  workflow_dispatch:

jobs:
  build_java:
      runs-on: ubuntu-latest
      permissions: write-all
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
      
  
        - name: Set up JDK
          uses: actions/setup-java@v5
          with:
            java-version: '21'
            distribution: 'temurin'

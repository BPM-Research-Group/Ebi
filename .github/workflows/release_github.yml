name: Release CLI, Java and manual

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:

    build_manual:
      runs-on: ubuntu-latest
      permissions: write-all
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Update version number
          id: version
          run: |
            cargo install cargo-edit
            VERS=${{ github.ref_name }}
            VERS="${VERS:1}"
            cargo set-version "$VERS"
            echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT

        - name: Generate manual parts
          run: |
            cargo run itself manual -o manual/functions.tex
            cargo run itself graph -o manual/graph.pdf

        - name: Build manual
          uses: xu-cheng/texlive-action@v3
          with:
            run: |
                cd manual
                lualatex -shell-escape manual.tex
                bibtex manual
                lualatex -shell-escape manual.tex
                lualatex -shell-escape manual.tex
                cd ..

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: manual
            path: manual/manual.pdf
            if-no-files-found: error
            overwrite: true
            archive: false


    build_cli_linux:
      runs-on: ubuntu-22.04
      permissions: write-all
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Update version number
          id: version
          run: |
            cargo install cargo-edit
            VERS=${{ github.ref_name }}
            VERS="${VERS:1}"
            cargo set-version "$VERS"
            echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT
            
        - name: Build CLI for Linux 64 bit
          run: |
            rustup target add x86_64-unknown-linux-gnu
            cargo build --release --target x86_64-unknown-linux-gnu

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: Ebi-x86_64-linux
            path: target/x86_64-unknown-linux-gnu/release/ebi
            if-no-files-found: error
            overwrite: true
            archive: false


    build_cli_windows:
      runs-on: ubuntu-latest
      permissions: write-all
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Update version number
          id: version
          run: |
            cargo install cargo-edit
            VERS=${{ github.ref_name }}
            VERS="${VERS:1}"
            cargo set-version "$VERS"
            echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT
            
        - name: Build CLI for Windows 64 bit
          run: |
            sudo apt-get install mingw-w64
            rustup target add x86_64-pc-windows-gnu
            cargo build --release --target x86_64-pc-windows-gnu

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: Ebi-x86_64-windows.exe
            path: target/x86_64-pc-windows-gnu/release/ebi.exe
            if-no-files-found: error
            overwrite: true
            archive: false

    build_cli_apple:
      runs-on: macos-latest
      permissions: write-all
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Update version number
          id: version
          run: |
            cargo install cargo-edit
            VERS=${{ github.ref_name }}
            VERS="${VERS:1}"
            cargo set-version "$VERS"
            echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT
            
        - name: Build CLI for Apple ARM
          run: |
            rustup target add aarch64-apple-darwin
            cargo build --release --target aarch64-apple-darwin
            mv target/aarch64-apple-darwin/release/ebi target/aarch64-apple-darwin/release/ebi.app

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: Ebi-arm-apple
            path: target/aarch64-apple-darwin/release/ebi.app
            if-no-files-found: error
            overwrite: true
            archive: false


    build_java:
      runs-on: ubuntu-22.04
      permissions: write-all
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Update version number
          id: version
          run: |
            cargo install cargo-edit
            VERS=${{ github.ref_name }}
            VERS="${VERS:1}"
            cargo set-version "$VERS"
            echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT

        - parallel:
          - name: Setup build environment
            run: |
              rustup target add x86_64-unknown-linux-gnu
              sudo apt-get install mingw-w64
              rustup target add x86_64-pc-windows-gnu

          - name: Generate Ebi
            run: |
              cargo run --features surface_generation -- itself surface java rust -o src/surfaces/java/java_autogen.rs
              cargo run --features surface_generation -- itself surface java java -o src/surfaces/java/org/ebitools/Ebi.java

          - name: Set up JDK
            uses: actions/setup-java@v3
            with:
              java-version: '21'
              distribution: 'temurin'

        - name: Build Java library
          run: |
            cargo build --target x86_64-unknown-linux-gnu --release --features java
            cargo build --target x86_64-pc-windows-gnu --release --features java
            jar cvf Ebi.jar src/surfaces/java/org/ebitools/Ebi.java -C target/x86_64-unknown-linux-gnu/release libebi.so -C target/x86_64-pc-windows-gnu/release/ ebi.dll

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: Ebi.jar
            path: Ebi.jar
            if-no-files-found: error
            overwrite: true
            archive: false
      
      
    create_Github_release:
        runs-on: ubuntu-latest
        permissions: write-all
        needs: [build_java, build_cli_linux, build_cli_windows, build_cli_apple, build_manual]
        steps:

            - name: Get version number
              id: version
              run: |
                VERS=${{ github.ref_name }}
                VERS="${VERS:1}"
                echo "version=$(echo $VERS)" >> $GITHUB_OUTPUT

            - name: download artifacts
              uses: actions/download-artifact@v8

            - name: Display structure of downloaded files
              run: ls -R

            - name: Create Github release
              uses: actions/create-release@v1
              id: create_release
              if: github.ref_type == 'tag'
              env: 
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with: 
                tag_name: ${{ github.ref_name }}
                release_name: Release ${{ steps.version.outputs.version }}

            - name: Add manual to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: manual.pdf/manual.pdf
                asset_name: manual.pdf
                asset_content_type: application/pdf

            - name: Add Linux to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: ebi/ebi
                asset_name: Ebi-x86_64-linux
                asset_content_type: application/x-executable

            - name: Add Windows to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: ebi.exe/ebi.exe
                asset_name: Ebi-x86_64-windows.exe
                asset_content_type: application/vnd.microsoft.portable-executable
            
            - name: Add Apple to CLI release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: ebi.app/ebi.app
                asset_name: Ebi-arm-apple
                asset_content_type: application/x-mach-binary

            - name: Add Ebi-Java to release
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: Ebi.jar/Ebi.jar
                asset_name: Ebi.jar
                asset_content_type: application/java-archive

            
